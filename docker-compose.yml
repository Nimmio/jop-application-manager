services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: job-application-manager:local
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/bewerbungstracker?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-development-secret-change-before-production}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    command: ["sh", "-c", "npx prisma migrate deploy && node .output/server/index.mjs"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bewerbungstracker
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bewerbungstracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
